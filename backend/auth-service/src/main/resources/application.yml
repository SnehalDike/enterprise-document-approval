#Application.yml
spring:
  application:
    name: document-approval-auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/document_approval_auth
    username: postgres
    password: snehashish
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 8081

logging:
  level:
    root: INFO
    com.snehal.documentapproval: DEBUG

management:
  endpoints:
    web:
      base-path: /actuator
